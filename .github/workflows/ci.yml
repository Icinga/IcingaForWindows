name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build module
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module (compile src/ -> lib/)
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Build-ModuleProject.ps1 -SkipTests;

      - name: Upload compiled module
        uses: actions/upload-artifact@v4
        with:
          name: compiled-module
          path: |
            lib/
            IcingaForWindows.psd1
          if-no-files-found: error

  memory:
    name: Test Daemon memory leak
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daemon memory leak test
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Test-ModuleDaemonMemoryLeak.ps1;

  docs:
    name: Build documentation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API documentation (strict)
        shell: pwsh
        run: |
          & .\build\Build-ModuleDocs.ps1;

  test:
    name: Pester tests
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled module
        uses: actions/download-artifact@v4
        with:
          name: compiled-module
          path: .

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck;

      - name: Run Pester
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Invoke-ModuleTests.ps1;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml
          if-no-files-found: ignore

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck;

      - name: Analyze code style
        shell: pwsh
        run: |
          & .\build\Invoke-ScriptAnalysis.ps1;
