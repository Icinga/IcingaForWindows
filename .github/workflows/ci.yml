name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build module
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module (compile src/ -> lib/)
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Build-ModuleProject.ps1 -SkipTests;

      - name: Validate compiled lib SPDX headers and UTF-8 encoding
        shell: pwsh
        run: |
          & .\build\Test-ModuleCodeStyling.ps1 -Path .\lib\IcingaForWindows.Classes.ps1, .\lib\IcingaForWindows.Kernel.ps1;

      - name: Upload compiled module
        uses: actions/upload-artifact@v4
        with:
          name: compiled-module
          path: |
            lib/
            IcingaForWindows.psd1
          if-no-files-found: error

  memory:
    name: Test Daemon memory leak
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daemon memory leak test
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Test-ModuleDaemonMemoryLeak.ps1;

  docs:
    name: Build documentation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API documentation (strict)
        shell: pwsh
        run: |
          & .\build\Build-ModuleDocs.ps1;

  test:
    name: Pester tests
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled module
        uses: actions/download-artifact@v4
        with:
          name: compiled-module
          path: .

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck;

      - name: Run Pester
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Split-Path $env:GITHUB_WORKSPACE -Parent)$([System.IO.Path]::PathSeparator)$env:PSModulePath";
          & .\build\Invoke-ModuleTests.ps1;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml
          if-no-files-found: ignore

  changelog-link:
    name: Auto-link Pull Request in Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
    permissions:
      contents: write
    steps:
      - name: Checkout Pull Request head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stamp PR link in Changelog.md and push if updated
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference = 'Stop';
          [int]$PrNumber = [int]$env:PR_NUMBER;
          [string]$BaseRef = ('origin/{0}' -f $env:PR_BASE_REF);
          $null = & ./build/Update-ModuleChangelog.ps1 -PullRequestNumber $PrNumber -BaseBranch $BaseRef;
          [string]$Changed = ((& git status --porcelain -- docs/General/Changelog.md) -join '').Trim();
          if (-not [string]::IsNullOrEmpty($Changed)) {
            & git config user.name 'github-actions[bot]';
            & git config user.email '41898282+github-actions[bot]@users.noreply.github.com';
            & git add -- docs/General/Changelog.md;
            & git commit -m ("Update Changelog.md with PR #{0} link" -f $PrNumber);
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to commit updated docs/General/Changelog.md.';
            }
            & git push origin ("HEAD:refs/heads/{0}" -f $env:PR_HEAD_REF);
            if ($LASTEXITCODE -ne 0) {
              throw ('Failed to push updated docs/General/Changelog.md to {0}.' -f $env:PR_HEAD_REF);
            }
            Write-Host ('::notice::Automatically linked PR #{0} in docs/General/Changelog.md and pushed to {1}.' -f $PrNumber, $env:PR_HEAD_REF);
          }

  analyze:
    name: Code Style, License, Changelog & PSScriptAnalyzer
    runs-on: windows-latest
    needs:
      - changelog-link
    if: always() && (needs.changelog-link.result == 'success' || needs.changelog-link.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main') && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck;

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & .\build\Invoke-ScriptAnalysis.ps1;

      - name: Validate Code Styling & SPDX License Headers
        shell: pwsh
        run: |
          & .\build\Test-ModuleCodeStyling.ps1;

      - name: Validate Changelog Entry on Pull Requests / Feature Branches
        shell: pwsh
        run: |
          & .\build\Test-ModuleChangelog.ps1;
